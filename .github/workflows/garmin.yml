name: Garmin-Update

on:
  schedule:
    # stündlich: GitHub startet geplante Läufe nicht zuverlässig und lässt viele aus
    # (bei „alle 3 Stunden“ kamen nur etwa 3 Läufe pro Tag an). Minute 43, weil zur vollen Stunde am meisten los ist.
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Wie viele Tage rückwirkend holen"
        default: "3"

permissions:
  contents: write

concurrency:
  group: garmin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # hängt ein Lauf, blockiert er sonst bis zu 6 Stunden alle weiteren
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Garmin-Anmeldung zwischen den Läufen aufbewahren, damit nicht jeder Lauf neu einloggt.
      # Das Repo ist öffentlich und der Cache für jeden Workflow-Lauf lesbar – deshalb nur verschlüsselt
      # (scripts/garmin_tokens.sh). Schlüssel: Secret GARMIN_CACHE_KEY, sonst das Garmin-Passwort.
      - name: Verschlüsselten Garmin-Login wiederherstellen
        id: tokens
        uses: actions/cache/restore@v4
        with:
          path: ~/.garmin-tokens.enc
          key: garmin-enc-${{ github.run_id }}
          restore-keys: garmin-enc-

      # Übergang: gibt es noch keine verschlüsselte Kopie, einmalig die alte unverschlüsselte übernehmen.
      # Sie wird nicht mehr neu gespeichert; die alten Einträge (garmin-tokens-…) verfallen nach 7 Tagen.
      - name: Alten Garmin-Login übernehmen (nur beim ersten Lauf)
        if: steps.tokens.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Garmin-Login entschlüsseln
        env:
          GARMIN_CACHE_KEY: ${{ secrets.GARMIN_CACHE_KEY || secrets.GARMIN_PASSWORD }}
        run: bash scripts/garmin_tokens.sh unpack

      - name: Abhängigkeiten installieren
        run: pip install --quiet "garminconnect>=0.3.20,<0.4"

      - name: Garmin-Daten holen
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python scripts/update_garmin.py --days "${{ github.event.inputs.days || '3' }}"

      - name: Pulsmesser erkennen (Brustgurt/Uhr)
        continue-on-error: true
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python scripts/update_hr_sources.py

      - name: Garmin-Login verschlüsseln
        id: pack
        if: always()
        env:
          GARMIN_CACHE_KEY: ${{ secrets.GARMIN_CACHE_KEY || secrets.GARMIN_PASSWORD }}
        run: bash scripts/garmin_tokens.sh pack

      - name: Verschlüsselten Garmin-Login speichern
        if: always() && steps.pack.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.garmin-tokens.enc
          key: garmin-enc-${{ github.run_id }}

      - name: Rennprognose speichern
        run: node scripts/save_prediction.js

      - name: Änderungen hochladen
        run: |
          git config user.name "garmin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/garmin-data.js data/prediction-history.json data/hr-sources.json 2>/dev/null || git add js/garmin-data.js data/prediction-history.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Garmin-Update $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main && exit 0
            else
              # Konflikt (meist im Prognose-Verlauf): neueste Daten übernehmen,
              # eigene Garmin-Daten behalten und Prognose neu berechnen.
              git rebase --abort
              cp js/garmin-data.js /tmp/garmin-data.js
              [ -f data/hr-sources.json ] && cp data/hr-sources.json /tmp/hr-sources.json
              git reset --hard origin/main
              cp /tmp/garmin-data.js js/garmin-data.js
              [ -f /tmp/hr-sources.json ] && cp /tmp/hr-sources.json data/hr-sources.json
              node scripts/save_prediction.js
              git add js/garmin-data.js data/prediction-history.json
              [ -f data/hr-sources.json ] && git add data/hr-sources.json
              git commit -m "Garmin-Update $(date -u +%Y-%m-%d)" || exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
